services:
  react_app:
    # En producción, CONTAINER_IMAGE se inyecta desde el workflow de deploy.
    # En desarrollo local, usa `build: .` directamente con `docker compose up --build`.
    image: ${CONTAINER_IMAGE:-ghcr.io/owner/attendance-react:latest}
    build: .
    restart: unless-stopped
    networks:
      - general_bridge
    ports:
      - "80"
    environment:
      # URL del backend API al que Nginx proxiará /api/*.
      # Default vacío: la app usa URLs relativas (/api/v1/...) y Nginx
      # hace proxy_pass a este backend.
      - API_BACKEND_URL=${API_BACKEND_URL:-}

networks:
  general_bridge:
    external: true
