name: CI/CD

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ci-cd-master
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # ─── 1. Lint + format + typecheck + test ────────────────────────────────────
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test --run

  # ─── 2. Build & push Docker image to GHCR ──────────────────────────────────
  build:
    name: build
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=
            type=raw,value=master
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── 3. Deploy to VPS via SSH (only on master push) ────────────────────────
  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd "${{ secrets.VPS_PROJECT_PATH }}"

            # Pull new image and recreate container
            export CONTAINER_IMAGE="ghcr.io/${{ github.repository }}:master"
            export API_BACKEND_URL="${{ secrets.API_BACKEND_URL }}"
            docker compose pull
            docker compose up -d --remove-orphans

            # Health check
            for i in $(seq 1 30); do
              if curl --fail --silent --max-time 3 http://localhost/; then
                echo "✅ Health check passed"
                exit 0
              fi
              sleep 1
            done

            echo "❌ Health check failed"
            docker ps
            docker logs --tail 100 2>&1 || true
            exit 1

  # ─── 4. Notify on failure (runs only if any prior job failed) ───────────────
  notify:
    name: notify
    needs: [lint, build, deploy]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Send failure notification
        if: env.DEPLOY_WEBHOOK_URL != ''
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -n "$DEPLOY_WEBHOOK_URL" ]; then
            curl --fail --silent --show-error --max-time 10 \
              -X POST "$DEPLOY_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "{\"text\":\"❌ CI/CD failed on master @ ${GITHUB_SHA:0:7}\\nRun: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" \
              || echo "Webhook notification failed (non-fatal)"
          fi
