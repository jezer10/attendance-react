name: Auto Deploy (develop)

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: deploy-develop
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─── 1. Build y push de imagen Docker a GitHub Container Registry ───────────
  build-push:
    name: Build & Push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=develop
            type=sha,format=short
            type=raw,value=latest

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── 2. Deploy en el VPS via SSH ────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    needs: build-push
    runs-on: ubuntu-latest
    # packages:read permite que GITHUB_TOKEN autentique docker pull en el VPS
    permissions:
      packages: read

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          # El GITHUB_TOKEN del workflow se pasa al script remoto como variable de entorno.
          # Es válido SOLO durante este run → login transitorio, no queda nada en el VPS.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          CONTAINER_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:develop
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          # Prioriza SSH key; si está vacío cae en password automáticamente
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          # Exporta las env vars definidas arriba al shell remoto
          envs: GH_TOKEN,GH_ACTOR,CONTAINER_IMAGE
          script: |
            set -e

            echo "🚀 Auto-deploying $CONTAINER_IMAGE ..."

            # ── Login transitorio con el token del workflow ──────────────────
            # El token expira al terminar el run de GitHub Actions.
            # Hacemos logout explícito al final para no dejar config en el VPS.
            echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

            cd ${{ secrets.VPS_PROJECT_PATH }}

            # Pull de la imagen :develop y reinicio del servicio
            docker compose pull
            docker compose down || true
            docker rm -f react-vite-app || true
            docker compose up -d --remove-orphans

            # ── Logout inmediato — sin credenciales almacenadas ──────────────
            docker logout ghcr.io

            # Limpia capas de imágenes antiguas
            docker image prune -f

            # ── Health check: espera a que el contenedor responda ────────────
            echo "⏳ Esperando health check en http://localhost..."
            for i in $(seq 1 30); do
              if curl --fail --silent --max-time 3 http://localhost/ > /dev/null 2>&1; then
                echo "✅ Health check OK tras ${i}s"
                echo "🎉 Auto-deploy completo"
                exit 0
              fi
              sleep 1
            done

            echo "❌ Health check falló tras 30s"
            docker ps --filter "name=react-vite-app" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            docker logs --tail 100 react-vite-app || true
            exit 1
