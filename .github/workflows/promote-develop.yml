name: Promote develop → master

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: promote-develop
  cancel-in-progress: true

jobs:
  # ─── 1. Espera a que el CI de develop pase (lint/test/build) ──────────────
  wait-ci:
    name: Wait for develop CI to pass
    runs-on: ubuntu-latest
    steps:
      - name: Verify CI status on develop HEAD
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Checks bloqueantes. Se listan explícitamente porque react-doctor
          # está configurado con continue-on-error en lint.yml y no debe
          # bloquear la promoción.
          BLOCKING=("lint" "test" "build")

          echo "Verificando estado de checks bloqueantes (${BLOCKING[*]}) en develop..."
          SHA="${{ github.sha }}"
          for i in $(seq 1 60); do
            CONCLUSIONS=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${{ github.repository }}/commits/${SHA}/check-runs" \
              --jq '[.check_runs[] | select(.name == "lint" or .name == "test" or .name == "build") | {name, conclusion}]')

            echo "Intento $i: checks bloqueantes ="
            echo "$CONCLUSIONS" | sed 's/^/  /'

            # Detecta fallos en checks bloqueantes
            FAILED=$(echo "$CONCLUSIONS" | jq -r '.[] | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out") | .name')
            if [ -n "$FAILED" ]; then
              echo "❌ Checks bloqueantes fallaron: $FAILED"
              exit 1
            fi

            # Verifica que todos los bloqueantes estén success
            NOT_SUCCESS=$(echo "$CONCLUSIONS" | jq -r '.[] | select(.conclusion != "success") | .name')
            if [ -z "$NOT_SUCCESS" ]; then
              # Doble check: que los 3 checks estén presentes
              COUNT=$(echo "$CONCLUSIONS" | jq 'length')
              if [ "$COUNT" -eq 3 ]; then
                echo "✅ Los 3 checks bloqueantes pasaron"
                exit 0
              fi
              echo "⏳ Esperando los 3 checks bloqueantes (vistos: $COUNT)..."
            fi

            sleep 5
          done

          echo "⏱️ Timeout esperando checks de develop (5 min)"
          exit 1

  # ─── 2. Abre o actualiza el PR develop → master con auto-merge ─────────────
  open-pr:
    name: Open or update PR develop → master
    needs: wait-ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Open or update PR develop → master
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          # Verifica que develop no esté atrás de master (por si alguien pusheó directo a master).
          BEHIND=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/compare/master...develop" \
            --jq '.behind_by')
          AHEAD=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/compare/master...develop" \
            --jq '.ahead_by')

          echo "develop está $AHEAD commits ahead, $BEHIND commits behind master"

          if [ "$AHEAD" = "0" ]; then
            echo "Nada que promover: develop ya está en master"
            exit 0
          fi

          if [ "$BEHIND" != "0" ]; then
            echo "❌ develop está $BEHIND commits behind master. Resolver manualmente antes de promover."
            echo "   Sugerencia: merge master → develop primero, o rebase develop sobre master."
            exit 1
          fi

          # Busca PR existente develop → master
          EXISTING_PR=$(gh pr list \
            --base master \
            --head develop \
            --state open \
            --json number --jq '.[0].number // empty')

          if [ -n "$EXISTING_PR" ]; then
            echo "ℹ️ PR #$EXISTING_PR ya existe; habilitando auto-merge"
            gh pr merge "$EXISTING_PR" --auto --squash --delete-branch=false
          else
            echo "🆕 Creando PR develop → master"
            PR_URL=$(gh pr create \
              --base master \
              --head develop \
              --title "chore(release): promote develop to master" \
              --body "Automated promotion of develop to master.

          - Triggered by: push to develop (commit \`${GITHUB_SHA:0:7}\`)
          - Source: \`develop\`
          - Target: \`master\`
          - Strategy: squash

          Auto-merge will fire when all required checks pass on this PR. The
          push to \`master\` then triggers \`.github/workflows/auto-deploy.yml\`
          which builds the image and deploys to the production VPS." \
              --reviewer '')

            echo "PR creado: $PR_URL"
            PR_NUMBER=$(echo "$PR_URL" | grep -oE '/pull/[0-9]+' | grep -oE '[0-9]+')
            gh pr merge "$PR_NUMBER" --auto --squash --delete-branch=false
          fi
