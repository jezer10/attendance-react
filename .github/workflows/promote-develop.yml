name: Promote develop → master

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: promote-develop
  cancel-in-progress: true

jobs:
  # ─── 1. Espera a que el CI de develop pase (lint/test/build) ──────────────
  wait-ci:
    name: Wait for develop CI to pass
    runs-on: ubuntu-latest
    steps:
      - name: Verify CI status on develop HEAD
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Checks bloqueantes. Se listan explícitamente porque react-doctor
          # está configurado con continue-on-error en lint.yml y no debe
          # bloquear la promoción.
          BLOCKING=("lint" "test" "build")

          echo "Verificando estado de checks bloqueantes (${BLOCKING[*]}) en develop..."
          SHA="${{ github.sha }}"
          for i in $(seq 1 60); do
            CONCLUSIONS=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${{ github.repository }}/commits/${SHA}/check-runs" \
              --jq '[.check_runs[] | select(.name == "lint" or .name == "test" or .name == "build") | {name, conclusion}]')

            echo "Intento $i: checks bloqueantes ="
            echo "$CONCLUSIONS" | sed 's/^/  /'

            # Detecta fallos en checks bloqueantes
            FAILED=$(echo "$CONCLUSIONS" | jq -r '.[] | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out") | .name')
            if [ -n "$FAILED" ]; then
              echo "❌ Checks bloqueantes fallaron: $FAILED"
              exit 1
            fi

            # Verifica que todos los bloqueantes estén success
            NOT_SUCCESS=$(echo "$CONCLUSIONS" | jq -r '.[] | select(.conclusion != "success") | .name')
            if [ -z "$NOT_SUCCESS" ]; then
              # Doble check: que los 3 checks estén presentes
              COUNT=$(echo "$CONCLUSIONS" | jq 'length')
              if [ "$COUNT" -eq 3 ]; then
                echo "✅ Los 3 checks bloqueantes pasaron"
                exit 0
              fi
              echo "⏳ Esperando los 3 checks bloqueantes (vistos: $COUNT)..."
            fi

            sleep 5
          done

          echo "⏱️ Timeout esperando checks de develop (5 min)"
          exit 1

  # ─── 2. Sincroniza develop con master si está atrás, luego crea/actualiza PR ─
  open-pr:
    name: Open or update PR develop → master
    needs: wait-ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      merged_sha: ${{ steps.wait-merge.outputs.merged_sha }}

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync develop onto master (merge if needed)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          # Mide ahead/behind.
          BEHIND=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/compare/master...develop" \
            --jq '.behind_by')
          AHEAD=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/compare/master...develop" \
            --jq '.ahead_by')

          echo "develop está $AHEAD commits ahead, $BEHIND commits behind master"

          if [ "$AHEAD" = "0" ] && [ "$BEHIND" = "0" ]; then
            echo "Nada que promover: develop y master están en el mismo commit"
            exit 0
          fi

          # Si develop está atrás, es porque promociones anteriores squash-mergearon
          # develop → master, rompiendo el ancestry compartido. Solución: hacer
          # merge de master en develop (no fast-forward), que introduce un merge
          # commit pero no requiere force-push. develop puede tener merge commits;
          # master se mantiene linear con squash.
          if [ "$BEHIND" != "0" ]; then
            echo "⚠️  develop está $BEHIND commit(s) behind master. Mergeando master en develop..."
            git fetch origin master
            # El merge commit NO usa [skip ci] para que CI corra sobre el sync.
            if ! git merge --no-ff origin/master -m "chore: sync develop with master"; then
              echo "❌ Merge produjo conflictos. Resolver manualmente."
              exit 1
            fi
            echo "✅ Merge exitoso. Pusheando a develop..."
            git push origin develop
          fi

      - name: Open or update PR develop → master
        id: wait-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          # Re-medir después del rebase.
          BEHIND=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/compare/master...develop" \
            --jq '.behind_by')
          AHEAD=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/compare/master...develop" \
            --jq '.ahead_by')

          echo "Después de sync: develop está $AHEAD commits ahead, $BEHIND commits behind master"

          if [ "$AHEAD" = "0" ]; then
            echo "Nada que promover: develop ya está en master"
            exit 0
          fi

          if [ "$BEHIND" != "0" ]; then
            echo "❌ develop aún está $BEHIND commits behind master tras sync. Abort."
            exit 1
          fi

          # Busca PR existente develop → master
          EXISTING_PR=$(gh pr list \
            --base master \
            --head develop \
            --state open \
            --json number --jq '.[0].number // empty')

          if [ -n "$EXISTING_PR" ]; then
            echo "ℹ️ PR #$EXISTING_PR ya existe; habilitando auto-merge (merge commit)"
            gh pr merge "$EXISTING_PR" --auto --merge --delete-branch=false
          else
            echo "🆕 Creando PR develop → master"
            PR_URL=$(gh pr create \
              --base master \
              --head develop \
              --title "chore(release): promote develop to master" \
              --body "Automated promotion of develop to master.

          - Triggered by: push to develop (commit \`${GITHUB_SHA:0:7}\`)
          - Source: \`develop\`
          - Target: \`master\`
          - Strategy: merge commit (preserves ancestry for next sync)

          Auto-merge will fire when all required checks pass on this PR.
          After merge, \`.github/workflows/auto-deploy.yml\` is invoked via
          \`workflow_call\` to build and deploy to the production VPS." \
              --reviewer '')

            echo "PR creado: $PR_URL"
            PR_NUMBER=$(echo "$PR_URL" | grep -oE '/pull/[0-9]+' | grep -oE '[0-9]+')
            gh pr merge "$PR_NUMBER" --auto --merge --delete-branch=false
          fi

          # Espera activa a que el PR se mergee para conocer el SHA final de master
          # (el merge_commit_sha). El auto-merge ocurre tras pasar los required checks
          # de master, no de develop, así que esperamos aquí.
          echo "⏳ Esperando a que el PR se mergee a master..."
          for i in $(seq 1 60); do
            MERGED_SHA=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${{ github.repository }}/pulls/$PR_NUMBER" \
              --jq '.merge_commit_sha // empty')
            if [ -n "$MERGED_SHA" ] && [ "$MERGED_SHA" != "null" ]; then
              echo "✅ PR mergeado en $MERGED_SHA"
              break
            fi
            sleep 5
          done

          if [ -z "$MERGED_SHA" ] || [ "$MERGED_SHA" = "null" ]; then
            echo "⏱️ Timeout esperando merge del PR; el deploy no se disparará automáticamente"
            exit 0
          fi

          # Set output para que el job de deploy lo use
          echo "merged_sha=$MERGED_SHA" >> "$GITHUB_OUTPUT"

  # ─── 3. Dispara auto-deploy una vez que el PR está mergeado a master ────────
  deploy:
    name: Deploy to production
    needs: open-pr
    if: needs.open-pr.outputs.merged_sha != ''
    uses: ./.github/workflows/auto-deploy.yml
    with:
      commit_sha: ${{ needs.open-pr.outputs.merged_sha }}
    secrets: inherit
